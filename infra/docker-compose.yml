services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: galperin
      POSTGRES_PASSWORD: galperin
      POSTGRES_USER: galperin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galperin -d galperin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - galperin

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - galperin

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://galperin:galperin@postgres:5432/galperin?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - galperin

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    depends_on:
      - api
    networks:
      - galperin

volumes:
  postgres-data:

networks:
  galperin:
    driver: bridge
